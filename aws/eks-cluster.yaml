apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: microservices-cluster
  region: us-east-1
  version: "1.30"

managedNodeGroups:
  - name: standard-nodes
    instanceType: m5.large
    minSize: 2
    maxSize: 5
    desiredCapacity: 3
    volumeSize: 50
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true
        ebs: true
