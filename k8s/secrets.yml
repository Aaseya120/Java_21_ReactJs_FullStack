# ══════════════════════════════════════════════════════════════
# Secrets — sensitive values.
# In production use AWS Secrets Manager / HashiCorp Vault
# and inject via External Secrets Operator.
#
# To create this secret:
#   kubectl create secret generic microservices-secrets \
#     --from-literal=DB_PASS=postgres \
#     --from-literal=JWT_SECRET=your-512-bit-secret \
#     -n microservices
# ══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
  namespace: microservices
type: Opaque
# Base64-encoded values: echo -n "postgres" | base64
data:
  DB_PASS: cG9zdGdyZXM=   # postgres
  JWT_SECRET: NDA0RTYzNTI2NjU1NkE1ODZFMzI3MjM1NzUzODc4MkY0MTNGNDQyODQ3MkI0QjYyNTA2NDUzNjc1NjZCNTk3MA==
